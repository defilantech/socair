# gha-runner-scale-set values for the defilantech org's self-hosted runners,
# served by the existing ARC controller (release "arc" in arc-systems).
#   helm --kube-context microk8s upgrade --install defilantech-runners \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --version 0.12.1 -n arc-runners -f ci/runners/values.yaml
# Workflows use it with `runs-on: defilantech-runners`.
githubConfigUrl: https://github.com/defilantech
githubConfigSecret: defilantech-runners-github-app
runnerScaleSetName: defilantech-runners
minRunners: 0
# One 4-CPU node shared with other workloads: at most 3 jobs at once, the
# rest queue.
maxRunners: 3
template:
  spec:
    containers:
      - name: runner
        image: localhost:32000/socair-runner:2.337.0-1
        command: ["/home/runner/run.sh"]
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits: { cpu: "2", memory: 6Gi }
