# Builds ci/runners/Dockerfile inside the cluster (native amd64, no Docker on
# the workstation) and pushes it to the microk8s registry addon. Run:
#   kubectl --context microk8s -n arc-runners create configmap socair-runner-context \
#     --from-file=Dockerfile=ci/runners/Dockerfile --dry-run=client -o yaml | kubectl --context microk8s apply -f -
#   kubectl --context microk8s -n arc-runners delete job socair-runner-build --ignore-not-found
#   kubectl --context microk8s apply -f ci/runners/build-job.yaml
# Bump the tag here and in values.yaml together.
apiVersion: batch/v1
kind: Job
metadata:
  name: socair-runner-build
  namespace: arc-runners
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          # Kaniko is archived upstream; this pinned release still builds a
          # plain Dockerfile. Replace with BuildKit if it ever stops working.
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/Dockerfile
            - --destination=registry.container-registry.svc.cluster.local:5000/socair-runner:2.337.0-1
            - --insecure
            - --skip-tls-verify
            - --single-snapshot
          volumeMounts:
            - name: context
              mountPath: /workspace
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
      volumes:
        - name: context
          configMap:
            name: socair-runner-context
