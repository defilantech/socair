{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "socair.storeClaim" . }}
  labels:
    {{- include "socair.labels" . | nindent 4 }}
  {{- if or .Values.persistence.keep .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keep }}
    # The store holds promoted models and their audit log: keep it on uninstall.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
