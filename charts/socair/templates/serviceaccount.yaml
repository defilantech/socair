{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "socair.serviceAccountName" . }}
  labels:
    {{- include "socair.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Socair needs no Kubernetes API access, so it gets no token and no role.
automountServiceAccountToken: false
{{- end }}
