name: release

# A tag v<version> builds the release binaries, checks the build reproduces,
# attests each binary's provenance (SLSA, via GitHub artifact attestations),
# and creates a DRAFT release: publishing it is a maintainer's decision. A pull
# request that touches the release path runs the build and the
# reproducibility check only. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release.sh"

permissions:
  contents: read

env:
  # The exact toolchain, so anyone can reproduce a release byte for byte.
  GO_VERSION: "1.27.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: build and check the build reproduces
        run: |
          version=0.0.0-dryrun
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          scripts/build-release.sh --check "$version" dist
          cat dist/SHA256SUMS

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestations
      attestations: write  # store them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # A fresh build, not one carried over from the build job: it is
      # reproducible, so it is byte-identical to what that job checked.
      - name: build
        run: scripts/build-release.sh --check "${GITHUB_REF_NAME#v}" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/socair_*
            dist/socair-sigstore_*
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag \
            --title "Socair ${GITHUB_REF_NAME}" --generate-notes
