name: release

# A tag v<version> builds the release binaries, checks the build reproduces,
# attests each binary's provenance (SLSA, via GitHub artifact attestations)
# and its SBOM, and creates a DRAFT release: publishing it is a maintainer's
# decision. It then pushes the container image and the Helm chart to GHCR,
# each attested. A pull request that touches the release path runs the build,
# the reproducibility check, and the SBOM step only. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release.sh"

permissions:
  contents: read

env:
  # The exact toolchain, so anyone can reproduce a release byte for byte.
  GO_VERSION: "1.27.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: build and check the build reproduces
        run: |
          version=0.0.0-dryrun
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          scripts/build-release.sh --check "$version" dist
          cat dist/SHA256SUMS
      # The same SBOM step the publish job runs, so a pull request tests it.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: the SBOM lists the modules linked into the binaries
        run: |
          jq -e '[.components[].name] | index("github.com/defilantech/socair-verify")' sbom.cdx.json >/dev/null
          jq -e '[.components[].name] | index("github.com/sigstore/sigstore-go")' sbom.cdx.json >/dev/null

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestations
      attestations: write  # store them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # A fresh build, not one carried over from the build job: it is
      # reproducible, so it is byte-identical to what that job checked.
      - name: build
        run: scripts/build-release.sh --check "${GITHUB_REF_NAME#v}" dist
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/socair_*
            dist/socair-sigstore_*
      # Socair's own SBOM: the Go modules linked into each release binary,
      # read from the binaries' build information. It and the attestations
      # file go in meta/, not dist/, so the subject globs never match them.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/socair_*
            dist/socair-sigstore_*
          sbom-path: sbom.cdx.json
      # The attestations as a release asset too: verifiers that read release
      # assets (OpenSSF Scorecard, `gh attestation verify --bundle` offline)
      # find them there. The chart job appends the chart's.
      - name: collect the attestations
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p meta
          jq -c . "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE" > "meta/socair_${v}.intoto.jsonl"
          mv sbom.cdx.json "meta/socair_${v}.cdx.json"
          wc -l "meta/socair_${v}.intoto.jsonl"
      # A version with a suffix (0.2.0-rc.1) is a pre-release, so the draft
      # is marked as one: publishing locks the flag with the release.
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME#v}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* meta/* --draft --verify-tag \
            "${prerelease[@]}" --title "Socair ${GITHUB_REF_NAME}" --generate-notes

  # The container image (Dockerfile) for linux/amd64 and linux/arm64, pushed
  # to GHCR and attested like the binaries. It carries the release binaries
  # rebuilt here, byte-identical to the draft's (the build reproduces).
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io/defilantech/socair
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: build the binaries
        id: build
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.build.outputs.version }}
          tags: ghcr.io/defilantech/socair:${{ steps.build.outputs.version }}
          push: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/socair
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The Helm chart, versioned as the tag with the image of the same version,
  # pushed to GHCR as an OCI artifact and attached to the draft release, both
  # attested. Publishing the release adds the attached chart to the Helm
  # repository (distribute.yml).
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the chart to the draft release
      packages: write      # push to ghcr.io/defilantech/charts/socair
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      # Docker's login, which the attestation reads to push to the registry;
      # helm keeps its own (`helm registry login` below). Without it the
      # attestation fails with "No credentials found for registry ghcr.io",
      # as v0.1.0-rc.2's did.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: package and push the chart
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package charts/socair --version "$v" --app-version "$v" -d chart-dist
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm push "chart-dist/socair-$v.tgz" oci://ghcr.io/defilantech/charts 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          [ -n "$digest" ] || { echo "helm push printed no digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The archive first: attesting it and attaching it to the draft need no
      # registry, so the release is complete even if the registry step fails.
      - id: chart-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: chart-dist/socair-*.tgz
      # The archive, and its attestation appended to the release's
      # attestations file, which the publish job created.
      - name: attach the chart to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_BUNDLE: ${{ steps.chart-provenance.outputs.bundle-path }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" "chart-dist/socair-$v.tgz"
          gh release download "${GITHUB_REF_NAME}" -p "socair_${v}.intoto.jsonl" -D meta
          jq -c . "$CHART_BUNDLE" >> "meta/socair_${v}.intoto.jsonl"
          gh release upload "${GITHUB_REF_NAME}" "meta/socair_${v}.intoto.jsonl" --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/charts/socair
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
