name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Dependencies are vendored, so the build needs no network. Air-gap builds
    # use the same path.
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: vendor is in sync
        run: go mod verify
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  # The Go build is air-gap: dependencies are vendored and nothing is fetched.
  # The wizard is not: it builds from the npm registry in a networked step, and
  # the shipped output is the static files this job produces.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: check
        run: npm run check
      - name: test
        run: npm run test
      - name: build
        run: npm run build
