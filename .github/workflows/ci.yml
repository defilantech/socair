name: ci

on:
  # main on push; every other branch through its pull request, so one change
  # runs CI once, not twice.
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request (or main) cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# Actions are pinned by commit SHA, not by a movable tag. Dependabot proposes
# updates (.github/dependabot.yml).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Dependencies are vendored, so the build needs no network. Air-gap builds
    # use the same path.
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: module checksums
        run: go mod verify
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race detector)
        run: go test -race ./...

  # The chat-template check against real templates: the 70 that llama.cpp
  # ships in models/templates, at a pinned commit. Networked (it fetches that
  # directory), so it is kept out of the air-gap job above. The templates come
  # from model vendors under their own licenses and are not committed here.
  # Move the pin deliberately and record the result in
  # docs/false-positive-baseline.md.
  real-template-corpus:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 7fe450e19305b828c199d602c23a8337aaa1f03b
          path: corpus/llama.cpp
          sparse-checkout: models/templates
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: no real template is flagged
        run: |
          SOCAIR_TEMPLATE_CORPUS="$GITHUB_WORKSPACE/corpus/llama.cpp/models/templates" \
            go test ./internal/checks/chattemplate -run RealTemplates -v

  # Networked checks on the supply chain and the code. They fetch the
  # vulnerability database and the pinned tools, so they are kept out of the
  # air-gap job above.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # go mod verify checks the module cache, not vendor/. Re-vendoring and
      # diffing catches a vendor/ edit that go.mod and go.sum do not explain.
      - name: vendor matches go.mod
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # staticcheck 0.8.1 (the latest) cannot read go1.27.2's export data
      # ("export data version 5"), so it analyses under go1.27.1. Tests and
      # govulncheck still run on the current 1.27 release.
      - name: staticcheck
        run: GOTOOLCHAIN=go1.27.1 go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # The optional keyless verifier (tools/socair-sigstore) is its own module
  # with its own vendor/: its ~70 dependencies stay out of socair's build. It
  # gets the same air-gap build and the same supply-chain checks.
  sigstore-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/socair-sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/socair-sigstore/go.mod
          cache: false
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l ./*.go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet, build, test (race detector), air-gap
        env:
          GOFLAGS: -mod=vendor
        run: |
          go vet ./...
          go build ./...
          go test -race ./...
      - name: vendor matches go.mod
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # staticcheck 0.8.1 (the latest) cannot read go1.27.2's export data
      # ("export data version 5"), so it analyses under go1.27.1. Tests and
      # govulncheck still run on the current 1.27 release.
      - name: staticcheck
        run: GOTOOLCHAIN=go1.27.1 go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # The Tier 2 probe helper (tools/socair-probe) is Python, standard library
  # only, and kept out of the Go build. Its tests are offline, against a local
  # fake engine, and the runner's own Python is enough. Then Socair's engine
  # runs it end to end against an httptest engine.
  probe-helper:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: helper tests
        working-directory: tools/socair-probe
        run: python3 -m unittest discover -s tests -t . -v
      - name: the engine against the helper
        run: |
          SOCAIR_TEST_PROBE_HELPER="$GITHUB_WORKSPACE/tools/socair-probe/socair-probe" \
            go test ./internal/engine -run RealProbeHelper -v

  # Every parser that reads untrusted bytes, for a short budget each. A crasher
  # found here is committed under testdata/fuzz as a regression seed, and the
  # seeds already committed run in the test job on every push.
  # One job runs every fuzz target in turn: a runner per 10-second target cost
  # more in pod start, checkout, and toolchain setup than the fuzzing itself.
  # A failing target does not stop the others; the job fails if any did.
  fuzz:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: fuzz every target for 10s
        run: |
          failed=""
          while read -r pkg fn; do
            echo "::group::$fn ($pkg)"
            go test "$pkg" -run '^$' -fuzz "^${fn}\$" -fuzztime 10s || failed="$failed $fn"
            echo "::endgroup::"
          done <<'TARGETS'
          ./internal/gguf FuzzGGUFHeader
          ./internal/safetensors FuzzSafetensorsHeader
          ./internal/checks/pickle FuzzPickleInspect
          ./internal/checks/chattemplate/jinja FuzzParse
          ./internal/checks/chattemplate FuzzInspect
          ./internal/oms FuzzVerify
          ./internal/acceptance FuzzParse
          ./internal/feed FuzzLoad
          TARGETS
          if [ -n "$failed" ]; then echo "fuzz failures:$failed"; exit 1; fi

  # The Go build is air-gap: dependencies are vendored and nothing is fetched.
  # The wizard is not: it builds from the npm registry in a networked step, and
  # the shipped output is the static files this job produces.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: check
        run: npm run check
      - name: test
        run: npm run test
      - name: build
        run: npm run build
