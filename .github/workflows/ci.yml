name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Dependencies are vendored, so the build needs no network. Air-gap builds
    # use the same path.
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: vendor is in sync
        run: go mod verify
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
