name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# Actions are pinned by commit SHA, not by a movable tag. Dependabot proposes
# updates (.github/dependabot.yml).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Dependencies are vendored, so the build needs no network. Air-gap builds
    # use the same path.
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: module checksums
        run: go mod verify
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race detector)
        run: go test -race ./...

  # The chat-template check against real templates: the 70 that llama.cpp
  # ships in models/templates, at a pinned commit. Networked (it fetches that
  # directory), so it is kept out of the air-gap job above. The templates come
  # from model vendors under their own licenses and are not committed here.
  # Move the pin deliberately and record the result in
  # docs/false-positive-baseline.md.
  real-template-corpus:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ggml-org/llama.cpp
          ref: 7fe450e19305b828c199d602c23a8337aaa1f03b
          path: corpus/llama.cpp
          sparse-checkout: models/templates
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: no real template is flagged
        run: |
          SOCAIR_TEMPLATE_CORPUS="$GITHUB_WORKSPACE/corpus/llama.cpp/models/templates" \
            go test ./internal/checks/chattemplate -run RealTemplates -v

  # Networked checks on the supply chain and the code. They fetch the
  # vulnerability database and the pinned tools, so they are kept out of the
  # air-gap job above.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # go mod verify checks the module cache, not vendor/. Re-vendoring and
      # diffing catches a vendor/ edit that go.mod and go.sum do not explain.
      - name: vendor matches go.mod
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # The optional keyless verifier (tools/socair-sigstore) is its own module
  # with its own vendor/: its ~70 dependencies stay out of socair's build. It
  # gets the same air-gap build and the same supply-chain checks.
  sigstore-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/socair-sigstore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/socair-sigstore/go.mod
          cache: false
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l ./*.go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet, build, test (race detector), air-gap
        env:
          GOFLAGS: -mod=vendor
        run: |
          go vet ./...
          go build ./...
          go test -race ./...
      - name: vendor matches go.mod
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # Every parser that reads untrusted bytes, for a short budget each. A crasher
  # found here is committed under testdata/fuzz as a regression seed, and the
  # seeds already committed run in the test job on every push.
  fuzz:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/gguf, fn: FuzzGGUFHeader }
          - { pkg: ./internal/safetensors, fn: FuzzSafetensorsHeader }
          - { pkg: ./internal/checks/pickle, fn: FuzzPickleInspect }
          - { pkg: ./internal/checks/chattemplate/jinja, fn: FuzzParse }
          - { pkg: ./internal/checks/chattemplate, fn: FuzzInspect }
          - { pkg: ./internal/oms, fn: FuzzVerify }
          - { pkg: ./internal/acceptance, fn: FuzzParse }
          - { pkg: ./internal/feed, fn: FuzzLoad }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: fuzz ${{ matrix.target.fn }}
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 10s

  # The Go build is air-gap: dependencies are vendored and nothing is fetched.
  # The wizard is not: it builds from the npm registry in a networked step, and
  # the shipped output is the static files this job produces.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: check
        run: npm run check
      - name: test
        run: npm run test
      - name: build
        run: npm run build
