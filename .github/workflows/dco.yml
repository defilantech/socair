name: dco

# Every commit in a pull request carries a Developer Certificate of Origin
# sign-off by its author (CONTRIBUTING.md). The check is a script in this
# repository, so what it enforces is readable here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE" "$HEAD"
