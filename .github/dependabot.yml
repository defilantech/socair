version: 2
updates:
  # Go modules are vendored. Dependabot detects the committed vendor/
  # directory and re-vendors on update by itself (there is no option for it),
  # and CI's supply-chain job checks vendor/ matches go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /tools/socair-sigstore
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # SvelteKit 2.x declares typescript ^5.3.3 || ^6.0.0 as its peer, so
      # TypeScript 7 does not install (#98). Lift this when SvelteKit does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node runtime, Node 22 LTS in CI and the build;
      # newer majors type APIs the runtime lacks (#99). Move it with the
      # runtime, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # The image's base images, pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The wizard builds on Node 22 LTS, as in CI; move both together.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
